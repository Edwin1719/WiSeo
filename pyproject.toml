[project]
name = "seo-agent"
version = "0.1.0"
description = "Agente virtual SEO profesional — Wigolo + OpenSEO + DeepSeek"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.42.0",
    "mcp>=1.6.0",
    "openai>=1.70.0",       # DeepSeek usa API compatible con OpenAI
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
